windowrule = float true,match:class ^(Signal)$ # Signal-Gtk
windowrule = float true,match:class ^(com.github.rafostar.Clapper)$ # Clapper-Gtk
windowrule = float true,match:class ^(app.drey.Warp)$ # Warp-Gtk
windowrule = float true,match:class ^(net.davidotek.pupgui2)$ # ProtonUp-Qt
windowrule = float true,match:class ^(yad)$ # Protontricks-Gtk
windowrule = float true,match:class ^(eog)$ # Imageviewer-Gtk
windowrule = float true,match:class ^(io.github.alainm23.planify)$ # planify-Gtk
windowrule = float true,match:class ^(io.gitlab.theevilskeleton.Upscaler)$ # Upscaler-Gtk
windowrule = float true,match:class ^(com.github.unrud.VideoDownloader)$ # VideoDownloader-Gkk
windowrule = float true,match:class ^(io.gitlab.adhami3310.Impression)$ # Impression-Gtk
windowrule = float true,match:class ^(io.missioncenter.MissionCenter)$ # MissionCenter-Gtk
windowrule = float true,match:title ^(Friends List)$ # Steam Friends List
windowrule = float true,match:title ^(Steam Settings)$ # Steam Settings
windowrule = float true,match:initial_title ^(Image Editor)$,match:class ^(blender)$ # Blender Render
windowrule = size (monitor_w*0.5) (monitor_h*0.5),match:initial_title ^(Image Editor)$,match:class ^(blender)$

# workaround for jetbrains IDEs dropdowns/popups cause flickering
windowrule = no_initial_focus true,match:class ^(.*jetbrains.*)$,match:title ^(win[0-9]+)$

# █░░ ▄▀█ █▄█ █▀▀ █▀█   █▀█ █░█ █░░ █▀▀ █▀
# █▄▄ █▀█ ░█░ ██▄ █▀▄   █▀▄ █▄█ █▄▄ ██▄ ▄█

layerrule = blur true,match:namespace rofi
layerrule = ignore_alpha 0,match:namespace rofi
layerrule = blur true,match:namespace notifications
layerrule = ignore_alpha 0,match:namespace notifications
layerrule = blur true,match:namespace swaync-notification-window
layerrule = ignore_alpha 0,match:namespace swaync-notification-window
layerrule = blur true,match:namespace swaync-control-center
layerrule = ignore_alpha 0,match:namespace swaync-control-center
layerrule = blur true,match:namespace logout_dialog

# hyprlang endif

# Reproductor Modal
layerrule = blur true,match:namespace gtk-layer-shell
layerrule = ignore_alpha 0.25,match:namespace gtk-layer-shell

# WhatsApp Open
windowrule = match:class ferdium, workspace 2 silent

# Discord Open
windowrule = workspace 3 silent,match:class ^(discord)$

windowrule = opacity 0.95 $& 0.95 $& 1,match:class ^(discord)$

# Cider Open
windowrule = match:class cider, workspace 4 silent

# CopyQ flotante
windowrule = match:class com.github.hluk.copyq, float true
windowrule = match:class com.github.hluk.copyq, size 760 560

# Juegos Steam / Heroic / Wine / Proton

# Control
windowrule = workspace 6 silent,match:class ^(control_dx12\.exe)$
windowrule = fullscreen 1,match:class ^(control_dx12\.exe)$
windowrule = opacity 1 $& 1 $& 1,match:class ^(control_dx12\.exe)$
windowrule = idle_inhibit fullscreen,match:class ^(control_dx12\.exe)$

# Steam Games
windowrule = workspace 6 silent,match:class ^(steam_app_.*)$
windowrule = fullscreen 1,match:class ^(steam_app_.*)$
windowrule = opacity 1 $& 1 $& 1,match:class ^(steam_app_.*)$
windowrule = idle_inhibit fullscreen,match:class ^(steam_app_.*)$

# Heroic
windowrule = workspace 6 silent,match:class ^(heroic)$
windowrule = opacity 1 $& 1 $& 1,match:class ^(heroic)$

# Calculadora flotante
windowrule = match:class ^(org.gnome.Calculator)$, float true
windowrule = match:class ^(org.gnome.Calculator)$, center true
windowrule = match:class ^(org.gnome.Calculator)$, size 420 620

# Dolphin flotante
windowrule = match:class ^(org.kde.dolphin)$, float true
windowrule = match:class ^(org.kde.dolphin)$, center true
windowrule = match:class ^(org.kde.dolphin)$, size 1100 720

# Xpad flotante
windowrule = match:class ^(xpad)$, float true
windowrule = match:class ^(xpad)$, center true
windowrule = match:class ^(xpad)$, size 520 420

# Kitty terminal flotante
windowrule = match:class ^(floating-terminal)$, float true
windowrule = match:class ^(floating-terminal)$, center true
windowrule = match:class ^(floating-terminal)$, size 1100 720

# matshell (GTK4 layer shell) - blur
layerrule = blur true,match:namespace gtk4-layer-shell
layerrule = blur true,match:namespace bar
layerrule = ignore_alpha 0.2,match:namespace gtk4-layer-shell
layerrule = ignore_alpha 0.2,match:namespace bar

# Modrinth
windowrule = match:class ^(modrinth-app)$, float true
windowrule = match:class ^(modrinth-app)$, size 1200 700
windowrule = match:class ^(modrinth-app)$, center true

# pwvucontrol - siempre flotante
windowrule = match:class ^(com\.saivert\.pwvucontrol)$, float true
windowrule = match:class ^(com\.saivert\.pwvucontrol)$, center true
windowrule = match:class ^(com\.saivert\.pwvucontrol)$, size 900 600
